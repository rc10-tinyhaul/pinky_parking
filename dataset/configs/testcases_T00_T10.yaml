# =============================================================================
# testcases_T00_T10.yaml — 2026-11-18 하네스 시험 케이스 정의 (주유소 제외)
# 읽는 곳: harness_runner/testcase.py (순수 파이썬), case_runner_node.py (ROS 노드)
#
# 구성
#   profiles : 트레일러 프로파일. T00 = 트레일러 0cm, T10 = 트레일러 10cm.
#              (가정) T00 은 robot_a, T10 은 robot_b 로 '한 번에 한 대씩' 시험한다.
#   thresholds : 합격 기준 기본값(케이스에서 덮어쓸 수 있음). 값은 초안이며 실측 후 조정(TODO).
#   run_order  : 한 프로파일 안에서 케이스를 실행하는 순서(출차 → 1번 → 2번 → 입차)
#   templates  : 케이스 템플릿. 프로파일마다 같은 6개가 생성되어 총 12개 케이스가 된다.
#
# 케이스 ID 규칙: <프로파일>-<순번>_<구역약어>_<동작>   예) T10-04_T2_CURVE
# 구역(zone): parking(주차장) | track1(안쪽) | track2(중간)
# 동작(action): exit(출차) | enter(입차) | straight(직선) | curve(곡선)
# 판정 종류(judge): lane = 차선 오프셋 기준 / park_enter = 정지 위치 오차 / park_exit = 트랙 합류 오프셋
#
# 미검증/주의
#   - 입차/출차 주행 알고리즘은 아직 없음(Park 액션은 정의만). 오늘은 사람이 조종/기존 제어로 주행하고
#     하네스는 '시작→측정→판정→기록' 틀만 제공한다.
#   - goal_xy_cm(주차칸 목표 좌표)는 현장 실측 전이라 비워 둠 → 입차 판정은 UNJUDGED(판정불가) 로 기록된다.
#   - 곡선 구간 길이/반경, 합격 기준 숫자는 모두 가정값 (TODO 측정).
# =============================================================================
meta:
  version: 1
  date: "2026-11-18"
  scope: "주유소 제외. 주차장 입/출차 + 1번/2번 트랙 직선/곡선"

profiles:
  T00: {robot: robot_a, trailer_cm: 0}
  T10: {robot: robot_b, trailer_cm: 10}

thresholds:
  lane_departure_limit_cm: 3.0   # |오프셋| 이 값을 넘으면 '이탈' 로 센다
  max_departures: 0              # 허용 이탈 횟수
  max_lane_max_cm: 3.0           # 오프셋 절댓값 최대 허용치 [cm]
  min_confidence_ratio: 0.8      # confidence ≥ 0.5 인 샘플 비율이 이 값 이상이어야 판정 신뢰(미만이면 UNJUDGED)
  min_samples: 20                # 샘플이 이보다 적으면 UNJUDGED
  max_stop_error_cm: 2.0         # 입차 정지 위치 오차 허용치 [cm]
  max_join_offset_cm: 3.0        # 출차 후 트랙 합류 시 마지막 오프셋 허용치 [cm]

run_order: [P_EXIT, T1_STRAIGHT, T1_CURVE, T2_STRAIGHT, T2_CURVE, P_ENTER]

templates:
  P_EXIT:
    zone: parking
    track: 0
    action: exit
    mode: EXIT
    judge: park_exit
    done_when: {type: manual, timeout_s: 60}
    description: "주차장에서 출차하여 트랙에 합류"
  T1_STRAIGHT:
    zone: track1
    track: 1
    action: straight
    mode: DRIVE
    judge: lane
    done_when: {type: manual, timeout_s: 60}
    description: "1번 트랙(안쪽) 직선 구간"
  T1_CURVE:
    zone: track1
    track: 1
    action: curve
    mode: DRIVE
    judge: lane
    done_when: {type: manual, timeout_s: 60}
    description: "1번 트랙(안쪽) 곡선 구간"
  T2_STRAIGHT:
    zone: track2
    track: 2
    action: straight
    mode: DRIVE
    judge: lane
    done_when: {type: manual, timeout_s: 60}
    description: "2번 트랙(중간) 직선 구간"
  T2_CURVE:
    zone: track2
    track: 2
    action: curve
    mode: DRIVE
    judge: lane
    done_when: {type: manual, timeout_s: 60}
    description: "2번 트랙(중간) 곡선 구간"
  P_ENTER:
    zone: parking
    track: 0
    action: enter
    mode: ENTER
    judge: park_enter
    goal_xy_cm: null          # TODO(측정): 주차칸 목표 정지 좌표 [x, y] (odom 기준 cm)
    done_when: {type: parked, timeout_s: 90}
    description: "트랙에서 주차장으로 입차하여 정지"
