# calibration_points.yaml — 가제보 좌표 → 실제 핑키 좌표 변환용 기준점 (템플릿, 2026-11-20 사용자 승인 21:45)
# 사용: ./scripts/calibrate_coords.sh --in logs/gazebo_scenario/<실행번호>/coords_robot_a.npz [...b]
# 아래 null 을 모두 채우기 전에는 실행이 중단된다(템플릿 그대로 변환하는 사고 방지).
#
# 점 쌍 = 같은 물리적 위치의 (가제보 좌표, 실제 로봇 좌표계 좌표). 둘 다 mm.
#   sim  = 가제보 좌표(원점=트랙 타원 중심, +x 오른쪽, +y 위, configs/arena.yaml 과 같은 단위). 예: 슬롯 P_UP 위치, 트랙 직선 시작 등 arena.yaml 에서 읽은 값 또는 coords_*.csv 의 x_mm,y_mm.
#   real = 실제 핑키가 쓰는 좌표계(SLAM/AMCL map 등)에서 같은 위치를 읽은 값. 현장에서 직접 측정.
# 점은 2개 이상(서로 멀리, 되도록 3개 이상). 같은 직선 위의 점만 쓰면 회전이 부정확해진다(트랙의 서로 다른 쪽 모서리 권장).
allow_scale: false        # true 면 스케일도 구함(점 3개 이상 필요). false = 1:1 mm 가정
mirror: false             # 실제 좌표계의 손잡이(축 방향)가 가제보와 반대일 때만 true
max_residual_mm: 30.0     # 판정 기준 [가정값]: 점별 잔차 최대 — 결과 보기 전에 고정, 바꾸려면 사용자 승인
points:
  - {name: P1, sim: null, real: null}
  - {name: P2, sim: null, real: null}
  # - {name: P3, sim: [0, 0], real: [0, 0]}   # 형식 예시(값은 임의)
