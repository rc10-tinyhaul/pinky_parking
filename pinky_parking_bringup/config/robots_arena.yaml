# 임시 경기장 시뮬레이션의 로봇 목록 (scripts/make_arena_sim.py 가 만든 arena.world, 지도 maps/arena).
# 경기장 월드(#1)가 생기기 전까지 쓴다. 기본 robots.yaml(공장 월드)과 smoke test 는 그대로다.
# 좌표는 경기장 도면 좌표(원점 = 트랙 중심, 단위 m, rad)이자 AMCL 초기 위치.
# 시연은 주차된 상태에서 시작한다: A(pinky1) = 11번 칸, B(pinky2) = 10번 칸 (arena.yaml 의 slots).
# A 는 위를 보고 위로, B 는 아래를 보고 아래로 출차한다. B 는 칸 안에서 돌지 않으므로 트레일러를 달아도 되고,
# 뒤(위쪽)의 트레일러 10 cm 가 칸 안에 들도록 칸 가운데(y = -0.15)보다 5 cm 아래에 선다.
# 시작 자세는 dataset/xyz 의 coords_robot_a/b.csv 와 같다.
# 둘 다 위를 보고 선다. 출차는 11번은 위로, 10번은 아래로 (B 는 칸 안에서 돌아서 나간다).
# 관제센터의 '주차 자리로' 버튼도 이 자리로 되돌린다.
#   ros2 launch pinky_parking_bringup sim.launch.py robots:=<이 파일> map:=<maps/arena.yaml>
world_name: arena.world
robots:
  - {name: pinky1, domain_id: 11, x: 0.0, y: 0.15, yaw: 1.5708}      # slot_11
  - {name: pinky2, domain_id: 12, x: 0.0, y: -0.20, yaw: -1.5708}    # slot_10
