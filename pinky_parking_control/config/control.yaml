# 관제 서버 설정. 로봇 목록은 pinky_parking_bringup/config/robots.yaml 을 그대로 쓴다.
host: 0.0.0.0
port: 8080
status_rate_hz: 10        # 대시보드로 상태를 보내는 주기 (WebSocket)

# 로봇별 처음 차종 (T00 트레일러 없음, T10 10 cm, T15 15 cm). 대시보드나 API 로 바꿀 수 있다.
vehicles:
  pinky1: T00
  pinky2: T10

# 직접 운전(키보드·조이스틱) 속도 제한. 실물 첫 시험은 더 낮춘다.
teleop:
  max_linear: 0.15        # m/s
  max_angular: 1.2        # rad/s

# 작업 제한 시간 [s, 실제 시간]. 넘으면 Nav2 목표를 취소하고 '시간 초과'로 기록한다.
timeout_s:
  goto: 180
  park: 180
  unpark: 180
  drive: 300
  lane_change: 120
  fuel: 180
