# 사용법은 README.md 참고
#   GPU 없이:    docker compose up -d
#   NVIDIA GPU:  docker compose -f compose.yaml -f compose.gpu.yaml up -d
#   터미널:      docker compose exec sim bash
#   끝내기:      docker compose down
#
# 네트워크는 호스트와 공유하지 않는다. 시뮬레이션의 ROS 2 통신이 컨테이너 안에만 머물러,
# 같은 네트워크의 실물 로봇(같은 ROS_DOMAIN_ID)과 섞이지 않는다.
name: pinky_parking     # 폴더 이름과 상관없이 같은 프로젝트(컨테이너) 이름을 쓴다

services:
  sim:
    image: pinky_parking:jazzy
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:                 # 컨테이너 사용자를 호스트 사용자와 같은 UID/GID 로 (run.sh 가 넘긴다)
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    command: sleep infinity
    environment:
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      # 관제 대시보드 팀 비밀번호. 호스트에서 정한 값을 넘긴다 (docs/remote_access.md). 비우면 비밀번호 없음.
      - PINKY_CONTROL_PASSWORD=${PINKY_CONTROL_PASSWORD:-}
      # 관제 서버가 작업마다 궤적 파일을 남기는 곳 (저장소 폴더 안이라 호스트에 남는다. .gitignore)
      - PINKY_LOG_DIR=/ws/src/pinky_parking/logs
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw      # Gazebo·RViz 창
      - .:/ws/src/pinky_parking               # 저장소 연결: 고친 코드·저장한 지도가 호스트에 남음
    ports:
      # 관제 대시보드·API (pinky_parking_control). HTTP 만 열고 ROS 통신(DDS)은 컨테이너 안에 둔다.
      - "${CONTROL_PORT:-8080}:8080"
