# 주차 칸 (map 좌표 = 경기장 도면 좌표). x, y [m], yaw [rad] = 칸에 들어가 섰을 때의 위치와 방향.
# 위치는 pinky_parking_control/config/arena.yaml 의 slots 와 같고, 방향은 열린 쪽에서 들어가 섰을 때의
# 방향이다(10번은 아래에서 들어와 위, 11번은 위에서 들어와 아래). park 명령은 Nav2 목표 하나만 보내므로
# 도착 허용 오차(공식 0.25 m)만큼만 맞는다. 칸에 똑바로 들어가는 주차는 관제센터(park API)가 한다.
slots:
  slot_10: {x: 0.0, y: -0.15, yaw: 1.5708}
  slot_11: {x: 0.0, y: 0.15, yaw: -1.5708}
