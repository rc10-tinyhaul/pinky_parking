# 주행 경로 (map 좌표 = 경기장 도면 좌표의 경유점 목록). x, y [m], yaw [rad].
# lap: 1번 트랙(차선 중심 반지름 0.405 m, 직선 0.6 m, pinky_parking_control/config/arena.yaml)을
# 반시계로 도는 경유점. Nav2 목표점 주행이라 차선 안을 지키지는 않는다. 차선 중심선을 따라가는 주행은
# 관제센터(drive API)가 한다.
routes:
  lap:
    - {x: 0.405, y: 0.3, yaw: 1.5708}
    - {x: 0.0, y: 0.705, yaw: 3.14159}
    - {x: -0.405, y: -0.3, yaw: -1.5708}
    - {x: 0.0, y: -0.705, yaw: 0.0}
    - {x: 0.405, y: -0.3, yaw: 1.5708}
