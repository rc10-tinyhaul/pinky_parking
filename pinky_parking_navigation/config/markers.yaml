# 위치 보정용 ArUco 마커 (marker_localizer). 단위 m, rad. 좌표는 경기장 도면 좌표.
size: 0.05                  # 검은 정사각형 한 변
# 번호마다 크기가 다르면 여기에 적는다 (scripts/make_markers.py 로 만든 1 ~ 8 번은 80 mm).
size_by_id: {1: 0.08, 2: 0.08, 3: 0.08, 4: 0.08, 5: 0.08, 6: 0.08, 7: 0.08, 8: 0.08}
dictionary: DICT_4X4_50     # 로봇의 pinky_camera.py 와 같은 사전
camera:
  focal_px: 635             # 640 x 480 에서의 초점 거리 (OV5647, 화각 53.5 도). 보정하면 고친다
  width: 640
  height: 480
  forward: 0.05             # 로봇 중심에서 카메라 렌즈까지 앞쪽 거리
max_distance: 0.6           # 이보다 먼 마커는 쓰지 않는다 (멀수록 오차가 크다)
# 마커의 지도 위치: 번호 → {x, y, yaw}. yaw 는 마커의 오른쪽 방향.
# 자로 재지 않고 관제 화면의 "마커 등록"으로 채운다 (로봇을 주차 칸에 놓고 마커를 보게 한 뒤).
# 0: 교실에서 등록한 값. 10, 11, 20, 30: 경기장 도면 값(pinky_parking_control/config/arena.yaml 의
# markers, 시뮬레이션 월드와 같음). 실물 경기장에 붙인 뒤 "마커 등록"을 하면 실제 자리로 덮어쓴다.
markers:
  0:
    x: -0.0217
    y: 0.3638
    yaw: 0.0328
  10:
    x: 0.0
    y: 0.0
    yaw: 0.0
  11:
    x: 0.0
    y: 0.3
    yaw: 0.0
  20:
    x: -0.995
    y: -0.34
    yaw: 0.0
  30:
    x: -0.995
    y: 0.095
    yaw: 0.0
